<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำนวณราคาประกาศรับซื้อข้าวโพดอาหารสัตว์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fff;--page:#eef2ef;--ink:#101412;--muted:#5b6660;--line:#e1e7e3;--field:#f5f8f6;--green:#0b3d2e;--green2:#17704f;--hi:#e4f0e9;--zebra:#f7faf8;--shadow:0 1px 2px rgba(11,61,46,.06),0 8px 24px rgba(11,61,46,.07);--warn:#8a4b00;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c19;--page:#0e1210;--ink:#f1f4f2;--muted:#a1ada6;--line:#2a332e;--field:#1f2622;--green2:#6fc29b;--hi:#203028;--zebra:#1b211e;--shadow:0 8px 24px rgba(0,0,0,.35);--warn:#e0b25a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c19;--page:#0e1210;--ink:#f1f4f2;--muted:#a1ada6;--line:#2a332e;--field:#1f2622;--green2:#6fc29b;--hi:#203028;--zebra:#1b211e;--shadow:0 8px 24px rgba(0,0,0,.35);--warn:#e0b25a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.6}
.top{background:var(--green);color:#fff;padding:calc(34px + env(safe-area-inset-top,0px)) 20px 78px}
.top .in{max-width:1040px;margin:0 auto}
h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:700;margin:0;line-height:1.25;letter-spacing:-.01em}
main{max-width:1040px;margin:-48px auto 0;padding:0 16px 56px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:16px;display:grid;gap:16px}
.panel{background:var(--bg);border-radius:16px;box-shadow:var(--shadow);padding:20px;counter-increment:s}
.side{counter-reset:s}
.panel h2{display:flex;align-items:center;gap:10px;font-size:1.02rem;font-weight:600;margin:0 0 14px}
.panel h2::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:.82rem;font-weight:600}
.grid{display:grid;gap:14px}
label{display:block;font-size:.84rem;font-weight:500;color:var(--muted)}
input{width:100%;margin-top:6px;padding:11px 13px;font:inherit;font-size:1.05rem;font-weight:500;color:var(--ink);background:var(--field);border:1.5px solid transparent;border-radius:10px;transition:border-color .15s,background .15s}
input:hover{border-color:var(--line)}
input:focus{outline:none;border-color:var(--green2);background:var(--bg)}
input::placeholder{font-weight:400;font-size:.9rem}
.hint{font-size:.78rem;color:var(--muted);margin-top:3px;font-weight:400}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.sum span{background:var(--hi);border-radius:999px;padding:3px 12px;font-size:.82rem}
.sum b{font-weight:700}
.warn{color:var(--warn);font-size:.84rem;margin-top:10px}
.res{min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.bar .hint{flex-basis:100%;margin:0}
button{font:inherit;font-weight:600;padding:11px 20px;border:0;color:#fff;background:var(--green);border-radius:10px;cursor:pointer;box-shadow:var(--shadow);transition:background .15s}
button:hover{background:var(--green2)}
button:focus-visible{outline:2px solid var(--green2);outline-offset:2px}
.sec{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.sec:hover{background:var(--hi)}
.tw{overflow-x:auto;background:var(--bg);border-radius:16px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1rem}
th{background:var(--green);color:#fff;font-weight:600;padding:13px 18px;text-align:right}
th:first-child,td:first-child{text-align:left}
td{padding:9px 18px;text-align:right;border-bottom:1px solid var(--line);color:var(--muted)}
td:first-child{color:var(--ink)}
td:nth-child(2){font-weight:700;color:var(--ink);font-size:1.05rem}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:first-child{background:var(--hi)}
tbody tr:last-child td{border-bottom:0}
.pr{display:none}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}.side{position:static}.top{padding-bottom:70px}}
@media print{body{background:#fff;color:#000}.top,.side,.bar{display:none!important}main{display:block;margin:0;padding:0;max-width:none}.pr{display:block}.pr h2{margin:0;font-size:17pt;color:#0b3d2e}.pr p{margin:2px 0 10px;color:#444;font-size:11pt}.tw{box-shadow:none;border-radius:0}table{font-size:10.5pt}th{background:#0b3d2e!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:6px 10px}td{padding:2px 10px;color:#000;border-bottom:1px solid #ccc}tbody tr:nth-child(even),tbody tr:first-child{background:#eef3f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:14mm}}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>คำนวณราคาประกาศรับซื้อข้าวโพดอาหารสัตว์</h1></div></header>
<main>


<div class="side">
<section class="panel">
<h2>1. ราคาและกำไร</h2>
<div class="grid">
<label>ราคาที่ความชื้น 14.5% (FG) (บาท/กก.)<input id="base" type="number" step="any" value="11.00"></label>
<label>กำไรที่ต้องการ (บาท/กก.)<input id="profit" type="number" step="any" value="0.20"></label>
</div>
</section>

<section class="panel">
<h2>2. ค่าขนส่ง</h2>
<div class="grid">
<label>ระยะทาง (กม.)<input id="dist" type="number" step="any" value="120"><div class="hint">ตารางรองรับ 0–600 กม.</div></label>
<label>ราคาน้ำมัน (บาท/ลิตร)<input id="fuel" type="number" step="any" value="32.19"><div class="hint">ตารางรองรับ 25.19–50.19</div></label>
<label>ใช้ค่าขนส่งที่กำหนดเอง (บาท/กก.)<input id="tover" type="number" step="any" placeholder="เว้นว่างเพื่อใช้ตาราง"></label>
</div>
<div class="sum" id="sum" style="margin-top:12px"></div>
<div class="warn" id="warn"></div>
</section>
</div>
<div class="res">
<div class="bar"><button id="print">พิมพ์ / บันทึกเป็น PDF</button><button id="copy" class="sec">คัดลอกตาราง</button>
<div class="hint" id="phint">ในหน้าต่างพิมพ์ เลือกปลายทางเป็น "บันทึกเป็น PDF" ใบประกาศจะแสดงเฉพาะตารางราคา ไม่มีค่าขนส่งและกำไร</div></div>


<div class="pr"><h2>ประกาศราคารับซื้อข้าวโพดอาหารสัตว์</h2><p>ประกาศ ณ วันที่ <span id="pd"></span> · หน่วย: บาท/กก.</p></div>
<div class="tw" id="out"></div>

</div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var r2=function(x){return Math.round((x+1e-9)*100)/100};
var f=function(x){return x.toFixed(2)};
var rows=32;
// ตารางค่าขนส่ง (บาท/ตัน): ค่าเริ่มต้นของแต่ละช่วงระยะทางที่น้ำมัน 25.19 และเพิ่มขึ้น 3 บาท/ตัน ต่อน้ำมันที่เพิ่ม 1 บาท
var START=[137,193,249,304,360,416,472,527,583,638,694,749];
var BASE_FUEL=25.19,COLS=26,STEP=3;
function transport(){
  var o=$('tover').value,w=$('warn');w.textContent='';
  if(o!==''&&!isNaN(parseFloat(o))){$('sum').innerHTML='<span>ใช้ค่าที่กำหนดเอง <b>'+parseFloat(o).toFixed(3)+'</b> บาท/กก.</span>';return parseFloat(o)}
  var d=+$('dist').value,p=+$('fuel').value;
  var band=Math.max(0,Math.ceil(d/50-1e-9)-1),col=Math.ceil(p-BASE_FUEL-1e-9);
  if(d>600||d<0){w.textContent='ระยะทางเกิน 0–600 กม. ที่ตารางรองรับ ใช้ช่อง "ค่าขนส่งที่กำหนดเอง" แทน';band=Math.min(Math.max(band,0),11)}
  if(col<0||col>COLS-1){w.textContent=(w.textContent?w.textContent+' · ':'')+'ราคาน้ำมันอยู่นอกช่วง 25.19–50.19 ใช้คอลัมน์ใกล้สุด';col=Math.min(Math.max(col,0),COLS-1)}
  var ton=START[band]+STEP*col,kg=ton/1000;
  $('sum').innerHTML='<span>ช่วงระยะทาง <b>'+(band*50+(band?1:0))+'–'+((band+1)*50)+'</b> กม.</span><span>คอลัมน์น้ำมัน <b>'+(BASE_FUEL+col).toFixed(2)+'</b></span><span>ค่าขนส่ง <b>'+ton+'</b> บาท/ตัน = <b>'+kg.toFixed(3)+'</b> บาท/กก.</span>';
  return kg;
}
function render(){
  var T=transport(),b=+$('base').value||0,p=+$('profit').value||0,cut=0.007,d3=0.10;
  var net=b-T;
  
  var h='<table><thead><tr><th>ช่วงความชื้น</th><th>เบอร์ 2</th><th>เบอร์ 3</th></tr></thead><tbody>';
  for(var i=0;i<rows;i++){
    var lo=(14.1+0.5*i).toFixed(1),hi=(14.5+0.5*i).toFixed(1);
    var p2=r2(net*(1-cut*i)-p),p3=r2(p2-d3);
    h+='<tr><td>'+lo+'% – '+hi+'%</td><td>'+f(p2)+'</td><td>'+f(p3)+'</td></tr>';
  }
  $('out').innerHTML=h+'</tbody></table>';
}
document.querySelectorAll('input').forEach(function(e){e.addEventListener('input',render)});
$('print').addEventListener('click',function(){
  $('pd').textContent=new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
  try{window.print()}catch(e){$('phint').textContent='เบราว์เซอร์นี้ไม่เปิดหน้าต่างพิมพ์ ลองกด Ctrl/Cmd + P แทน'}
});
$('copy').addEventListener('click',function(){
  var t=document.querySelector('#out table');
  var txt=[].map.call(t.rows,function(r){return [].map.call(r.cells,function(c){return c.innerText}).join('\t')}).join('\n');
  var done=function(){$('copy').textContent='คัดลอกแล้ว'};
  try{navigator.clipboard.writeText(txt).then(done,done)}catch(e){done()}
});
render();
})();
</script>

</body>
</html>
